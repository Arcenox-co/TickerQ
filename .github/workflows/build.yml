name: Build NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate source license policy
        run: python3 -m unittest scripts.tests.test_license_policy -v

      - name: Read version from file
        id: get-version
        run: |
          VERSION=$(dotnet build src/TickerQ/TickerQ.csproj --getProperty:Version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect .NET version
        id: detect
        run: |
          DOTNET_VER=$(grep -oP '<TargetFramework>net\K[0-9]+' src/Directory.Build.props)
          echo "dotnet_version=${DOTNET_VER}.0.x" >> "$GITHUB_OUTPUT"

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ steps.detect.outputs.dotnet_version }}

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci --include=dev
        working-directory: src/TickerQ.Dashboard/wwwroot

      - name: Build frontend
        run: npm run build
        working-directory: src/TickerQ.Dashboard/wwwroot

      - name: Validate Dashboard bundled third-party notices
        run: |
          ./node_modules/.bin/vite build --sourcemap --outDir "$RUNNER_TEMP/tickerq-dashboard-license-audit" --emptyOutDir
          python3 ../../../scripts/generate-dashboard-third-party-notices.py \
            --bundle-dir "$RUNNER_TEMP/tickerq-dashboard-license-audit" \
            --node-modules ./node_modules \
            --source-dir ./src \
            --lockfile ./package-lock.json \
            --output ../DASHBOARD-THIRD-PARTY-NOTICES.md \
            --check
        working-directory: src/TickerQ.Dashboard/wwwroot

      - name: Build TickerQ.Utilities
        run: dotnet build src/TickerQ.Utilities/TickerQ.Utilities.csproj --configuration Release

      - name: Pack TickerQ.Utilities
        run: dotnet pack src/TickerQ.Utilities/TickerQ.Utilities.csproj --configuration Release --output ./nupkgs

      - name: Add local nupkgs source
        run: dotnet nuget add source "$(pwd)/nupkgs" --name LocalNupkgs

      - name: Restore packages with local source
        run: |
          dotnet restore src/TickerQ/TickerQ.csproj
          dotnet restore src/TickerQ.EntityFrameworkCore/TickerQ.EntityFrameworkCore.csproj
          dotnet restore src/TickerQ.Dashboard/TickerQ.Dashboard.csproj
          dotnet restore src/TickerQ.Instrumentation.OpenTelemetry/TickerQ.Instrumentation.OpenTelemetry.csproj
          dotnet restore src/TickerQ.Caching.StackExchangeRedis/TickerQ.Caching.StackExchangeRedis.csproj
          dotnet restore src/TickerQ.MongoDB/TickerQ.MongoDB.csproj
          dotnet restore hub/sdks/dotnet/TickerQ.SDK/TickerQ.SDK.csproj
          dotnet restore hub/remoteExecutor/TickerQ.RemoteExecutor/TickerQ.RemoteExecutor.csproj
          dotnet restore hub/remoteExecutor/TickerQ.RemoteExecutor.Tests/TickerQ.RemoteExecutor.Tests.csproj
          dotnet restore tests/TickerQ.Tests/TickerQ.Tests.csproj
          dotnet restore tests/TickerQ.EntityFrameworkCore.Tests/TickerQ.EntityFrameworkCore.Tests.csproj
          dotnet restore tests/TickerQ.Caching.StackExchangeRedis.Tests/TickerQ.Caching.StackExchangeRedis.Tests.csproj
          dotnet restore tests/TickerQ.SourceGenerator.Tests/TickerQ.SourceGenerator.Tests.csproj

      - name: Build TickerQ.SourceGenerator
        run: dotnet build src/TickerQ.SourceGenerator/TickerQ.SourceGenerator.csproj --configuration Release

      - name: Build other projects
        run: |
          dotnet build src/TickerQ/TickerQ.csproj --configuration Release
          dotnet build src/TickerQ.EntityFrameworkCore/TickerQ.EntityFrameworkCore.csproj --configuration Release
          dotnet build src/TickerQ.Dashboard/TickerQ.Dashboard.csproj --configuration Release
          dotnet build src/TickerQ.Instrumentation.OpenTelemetry/TickerQ.Instrumentation.OpenTelemetry.csproj --configuration Release
          dotnet build src/TickerQ.Caching.StackExchangeRedis/TickerQ.Caching.StackExchangeRedis.csproj --configuration Release
          dotnet build src/TickerQ.MongoDB/TickerQ.MongoDB.csproj --configuration Release
          dotnet build hub/sdks/dotnet/TickerQ.SDK/TickerQ.SDK.csproj --configuration Release
          dotnet build hub/remoteExecutor/TickerQ.RemoteExecutor/TickerQ.RemoteExecutor.csproj --configuration Release
          dotnet build hub/remoteExecutor/TickerQ.RemoteExecutor.Tests/TickerQ.RemoteExecutor.Tests.csproj --configuration Release
          dotnet build tests/TickerQ.Tests/TickerQ.Tests.csproj --configuration Release
          dotnet build tests/TickerQ.EntityFrameworkCore.Tests/TickerQ.EntityFrameworkCore.Tests.csproj --configuration Release
          dotnet build tests/TickerQ.Caching.StackExchangeRedis.Tests/TickerQ.Caching.StackExchangeRedis.Tests.csproj --configuration Release
          dotnet build tests/TickerQ.SourceGenerator.Tests/TickerQ.SourceGenerator.Tests.csproj --configuration Release

      - name: Run Node SDK tests
        working-directory: hub/sdks/node
        run: |
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          npm test

      - name: Pack and validate Node SDK licensing
        run: |
          mkdir -p ./npm-packages
          npm pack ./hub/sdks/node --pack-destination ./npm-packages
          NODE_VERSION=$(node -p "require('./hub/sdks/node/package.json').version")
          python3 scripts/validate-node-package.py \
            --archive "./npm-packages/tickerq-sdk-${NODE_VERSION}.tgz" \
            --version "$NODE_VERSION" \
            --commercial-license ./LICENSE.md \
            --third-party-notices ./THIRD-PARTY-NOTICES.md

      - name: Run .NET tests
        run: |
          dotnet test tests/TickerQ.Tests/ --configuration Release --no-build
          dotnet test tests/TickerQ.EntityFrameworkCore.Tests/ --configuration Release --no-build
          dotnet test tests/TickerQ.Caching.StackExchangeRedis.Tests/ --configuration Release --no-build -p:IsTestProject=true
          dotnet test tests/TickerQ.SourceGenerator.Tests/ --configuration Release --no-build
          dotnet test hub/remoteExecutor/TickerQ.RemoteExecutor.Tests/ --configuration Release --no-build

      - name: Pack other projects
        run: |
          dotnet pack src/TickerQ.SourceGenerator/TickerQ.SourceGenerator.csproj --configuration Release --output ./nupkgs
          dotnet pack src/TickerQ/TickerQ.csproj --configuration Release --output ./nupkgs
          dotnet pack src/TickerQ.EntityFrameworkCore/TickerQ.EntityFrameworkCore.csproj --configuration Release --output ./nupkgs
          dotnet pack src/TickerQ.Dashboard/TickerQ.Dashboard.csproj --configuration Release --output ./nupkgs
          dotnet pack src/TickerQ.Instrumentation.OpenTelemetry/TickerQ.Instrumentation.OpenTelemetry.csproj --configuration Release --output ./nupkgs
          dotnet pack src/TickerQ.Caching.StackExchangeRedis/TickerQ.Caching.StackExchangeRedis.csproj --configuration Release --output ./nupkgs
          dotnet pack src/TickerQ.MongoDB/TickerQ.MongoDB.csproj --configuration Release --output ./nupkgs
          dotnet pack hub/sdks/dotnet/TickerQ.SDK/TickerQ.SDK.csproj --configuration Release --output ./nupkgs
          dotnet pack hub/remoteExecutor/TickerQ.RemoteExecutor/TickerQ.RemoteExecutor.csproj --configuration Release --output ./nupkgs

      - name: Validate commercial package licenses
        run: python3 scripts/validate-package-licenses.py --directory ./nupkgs --version "${{ needs.prepare.outputs.version }}" --commercial-license ./LICENSE.md --third-party-notices ./THIRD-PARTY-NOTICES.md --dashboard-third-party-notices ./src/TickerQ.Dashboard/DASHBOARD-THIRD-PARTY-NOTICES.md --repository-commit "${{ github.sha }}"

      - name: Show package file sizes
        run: |
          echo "📦 Package sizes:"
          for pkg in ./nupkgs/*.nupkg; do
            [ -f "$pkg" ] && size=$(du -h "$pkg" | cut -f1) && echo " - $(basename "$pkg"): $size"
          done

      - name: Upload nupkgs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nupkgs
          path: ./nupkgs/*.nupkg
          if-no-files-found: error

      - name: Upload validated npm package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: ./npm-packages/*.tgz
          if-no-files-found: error

  mongo-verify:
    name: MongoDB runtime verification
    # Runtime verification is deliberately independent of package creation, so
    # the MongoDB Testcontainers suite runs on every release and manual build.
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect .NET version
        id: detect
        run: |
          DOTNET_VER=$(grep -oP '<TargetFramework>net\K[0-9]+' src/Directory.Build.props)
          echo "dotnet_version=${DOTNET_VER}.0.x" >> "$GITHUB_OUTPUT"

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ steps.detect.outputs.dotnet_version }}

      - name: Docker info preflight
        run: docker info

      - name: Build TickerQ.Utilities
        run: dotnet build src/TickerQ.Utilities/TickerQ.Utilities.csproj --configuration Release

      - name: Pack TickerQ.Utilities
        run: dotnet pack src/TickerQ.Utilities/TickerQ.Utilities.csproj --configuration Release --output ./nupkgs

      - name: Add local nupkgs source
        run: dotnet nuget add source "$(pwd)/nupkgs" --name LocalNupkgs

      - name: Restore MongoDB tests
        run: dotnet restore tests/TickerQ.MongoDB.Tests/TickerQ.MongoDB.Tests.csproj

      - name: Build MongoDB tests
        run: dotnet build tests/TickerQ.MongoDB.Tests/TickerQ.MongoDB.Tests.csproj --configuration Release

      - name: Run MongoDB tests
        run: |
          dotnet test tests/TickerQ.MongoDB.Tests/ --configuration Release --no-build --logger "trx;LogFileName=mongo.trx" --results-directory TestResults/Mongo

      - name: Capture Docker diagnostics on failure
        # Runs only when a prior step failed; the '|| true' guards keep this step
        # green so it never masks the underlying test failure that already marked
        # the job as failed.
        if: failure()
        run: |
          mkdir -p TestResults/Mongo
          docker info > TestResults/Mongo/docker-info.txt 2>&1 || true
          docker ps -a > TestResults/Mongo/docker-ps.txt 2>&1 || true

      - name: Upload MongoDB test diagnostics and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mongo-test-results
          path: TestResults/Mongo
          if-no-files-found: warn

  release-notification:
    needs:
      - prepare
      - build
      - mongo-verify
    if: always() && github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord notification
        if: always()
        continue-on-error: true
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MONGO_RESULT: ${{ needs.mongo-verify.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          message="📦 *${repo_name}* | Branch: \`${RELEASE_TARGET}\` | Release: \`${RELEASE_TAG}\`"

          if [ "$PREPARE_RESULT" != "success" ]; then
            status_emoji="❌"
            status_text="Preparation Failed"
            color=15158332
          elif [ "$MONGO_RESULT" != "success" ]; then
            status_emoji="❌"
            status_text="MongoDB Verification Failed"
            color=15158332
          elif [ "$BUILD_RESULT" != "success" ]; then
            status_emoji="❌"
            status_text="Build Failed"
            color=15158332
          else
            status_emoji="✅"
            status_text="Successful"
            color=3066993
          fi

          jq -n \
            --arg title "${status_emoji} TickerQ Deployment ${status_text}" \
            --arg description "$message" \
            --arg version "$VERSION" \
            --arg build_status "$BUILD_RESULT" \
            --arg footer "Deployed on $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --argjson color "$color" \
            '{embeds: [{title: $title, description: $description, color: $color,
              fields: [
                {name: "Version", value: $version, inline: true},
                {name: "Build Status", value: $build_status, inline: true}
              ], footer: {text: $footer}}]}' > payload.json

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST "$DISCORD_WEBHOOK" \
            --data @payload.json
