name: Build NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      # One release builds every .NET line from the same commit (see src/Directory.Build.props).
      versions: ${{ steps.get-version.outputs.versions }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate source license policy
        run: python3 -m unittest scripts.tests.test_license_policy -v

      - name: Read versions from file
        id: get-version
        run: |
          VERSIONS=""
          for line in 8 9 10 11; do
            VERSIONS="$VERSIONS $(dotnet build src/TickerQ/TickerQ.csproj --getProperty:Version -p:TickerQDotNetMajor=$line)"
          done
          echo "versions=${VERSIONS# }" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (.NET ${{ matrix.dotnet }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: [8, 9, 10, 11]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: TickerQ_CI_Only!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'TickerQ_CI_Only!2026' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DOTNET_NOLOGO: true
      LINE: -p:TickerQDotNetMajor=${{ matrix.dotnet }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Every line compiles with the .NET 10 SDK (C# 14) and tests on its own runtime; the .NET 11
      # preview SDK builds that line while .NET 11 is a release candidate.
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Setup .NET ${{ matrix.dotnet }} runtime
        if: matrix.dotnet == 8 || matrix.dotnet == 9
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ matrix.dotnet }}.0.x

      - name: Setup .NET 11 preview SDK
        if: matrix.dotnet == 11
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Read line version
        id: line
        run: |
          VERSION=$(dotnet build src/TickerQ/TickerQ.csproj --getProperty:Version $LINE)
          FRAMEWORK=$(dotnet build src/TickerQ/TickerQ.csproj --getProperty:TargetFramework $LINE)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "framework=$FRAMEWORK" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: npm ci --include=dev
        working-directory: src/TickerQ.Dashboard/wwwroot

      - name: Test frontend
        if: matrix.dotnet == 10
        run: npm test
        working-directory: src/TickerQ.Dashboard/wwwroot

      - name: Build frontend
        run: npm run build
        working-directory: src/TickerQ.Dashboard/wwwroot

      - name: Validate Dashboard bundled third-party notices
        if: matrix.dotnet == 10
        run: |
          ./node_modules/.bin/vite build --sourcemap --outDir "$RUNNER_TEMP/tickerq-dashboard-license-audit" --emptyOutDir
          python3 ../../../scripts/generate-dashboard-third-party-notices.py \
            --bundle-dir "$RUNNER_TEMP/tickerq-dashboard-license-audit" \
            --node-modules ./node_modules \
            --source-dir ./src \
            --lockfile ./package-lock.json \
            --output ../DASHBOARD-THIRD-PARTY-NOTICES.md \
            --check
        working-directory: src/TickerQ.Dashboard/wwwroot

      - name: Build TickerQ.Utilities
        run: dotnet build src/TickerQ.Utilities/TickerQ.Utilities.csproj --configuration Release $LINE

      - name: Pack TickerQ.Utilities
        run: dotnet pack src/TickerQ.Utilities/TickerQ.Utilities.csproj --configuration Release --output ./nupkgs $LINE

      - name: Add local nupkgs source
        run: dotnet nuget add source "$(pwd)/nupkgs" --name LocalNupkgs

      - name: Restore packages with local source
        run: |
          dotnet restore src/TickerQ/TickerQ.csproj $LINE
          dotnet restore src/TickerQ.EntityFrameworkCore/TickerQ.EntityFrameworkCore.csproj $LINE
          dotnet restore src/TickerQ.Dashboard/TickerQ.Dashboard.csproj $LINE
          dotnet restore src/TickerQ.Instrumentation.OpenTelemetry/TickerQ.Instrumentation.OpenTelemetry.csproj $LINE
          dotnet restore src/TickerQ.Caching.StackExchangeRedis/TickerQ.Caching.StackExchangeRedis.csproj $LINE
          dotnet restore src/TickerQ.MongoDB/TickerQ.MongoDB.csproj $LINE
          dotnet restore src/TickerQ.Integrations/TickerQ.Integrations.csproj $LINE
          dotnet restore tests/TickerQ.Tests/TickerQ.Tests.csproj $LINE
          dotnet restore tests/TickerQ.Integrations.Tests/TickerQ.Integrations.Tests.csproj $LINE
          dotnet restore tests/TickerQ.EntityFrameworkCore.Tests/TickerQ.EntityFrameworkCore.Tests.csproj $LINE
          dotnet restore tests/TickerQ.Caching.StackExchangeRedis.Tests/TickerQ.Caching.StackExchangeRedis.Tests.csproj $LINE
          dotnet restore tests/TickerQ.SourceGenerator.Tests/TickerQ.SourceGenerator.Tests.csproj $LINE

      - name: Build TickerQ.SourceGenerator
        run: dotnet build src/TickerQ.SourceGenerator/TickerQ.SourceGenerator.csproj --configuration Release $LINE

      - name: Build other projects
        run: |
          dotnet build src/TickerQ/TickerQ.csproj --configuration Release $LINE
          dotnet build src/TickerQ.EntityFrameworkCore/TickerQ.EntityFrameworkCore.csproj --configuration Release $LINE
          dotnet build src/TickerQ.Dashboard/TickerQ.Dashboard.csproj --configuration Release $LINE
          dotnet build src/TickerQ.Instrumentation.OpenTelemetry/TickerQ.Instrumentation.OpenTelemetry.csproj --configuration Release $LINE
          dotnet build src/TickerQ.Caching.StackExchangeRedis/TickerQ.Caching.StackExchangeRedis.csproj --configuration Release $LINE
          dotnet build src/TickerQ.MongoDB/TickerQ.MongoDB.csproj --configuration Release $LINE
          dotnet build src/TickerQ.Integrations/TickerQ.Integrations.csproj --configuration Release $LINE
          dotnet build tests/TickerQ.Tests/TickerQ.Tests.csproj --configuration Release $LINE
          dotnet build tests/TickerQ.Integrations.Tests/TickerQ.Integrations.Tests.csproj --configuration Release $LINE
          dotnet build tests/TickerQ.EntityFrameworkCore.Tests/TickerQ.EntityFrameworkCore.Tests.csproj --configuration Release $LINE
          dotnet build tests/TickerQ.Caching.StackExchangeRedis.Tests/TickerQ.Caching.StackExchangeRedis.Tests.csproj --configuration Release $LINE
          dotnet build tests/TickerQ.SourceGenerator.Tests/TickerQ.SourceGenerator.Tests.csproj --configuration Release $LINE

      - name: Run .NET tests
        run: |
          dotnet test tests/TickerQ.Tests/ --configuration Release --no-build $LINE
          dotnet test tests/TickerQ.Integrations.Tests/ --configuration Release --no-build $LINE
          dotnet test tests/TickerQ.EntityFrameworkCore.Tests/ --configuration Release --no-build $LINE
          dotnet test tests/TickerQ.Caching.StackExchangeRedis.Tests/ --configuration Release --no-build -p:IsTestProject=true $LINE
          dotnet test tests/TickerQ.SourceGenerator.Tests/ --configuration Release --no-build $LINE

      - name: Verify SQL Server seeding, edits and transactions
        env:
          TICKERQ_SQLSERVER_CONNECTION: 'Server=localhost,1433;User Id=sa;Password=TickerQ_CI_Only!2026;Encrypt=True;TrustServerCertificate=True'
        run: dotnet test tests/TickerQ.EntityFrameworkCore.Tests/ --configuration Release --no-build --filter 'FullyQualifiedName~SqlServerRuntimeTests|FullyQualifiedName~EfTransactionalSchedulingTests.SqlServer' $LINE

      - name: Verify EF concurrent seeding and transactional scheduling
        env:
          TICKERQ_POSTGRES_RACE_TESTS: "1"
        run: dotnet test tests/TickerQ.EntityFrameworkCore.Tests/ --configuration Release --no-build --filter 'FullyQualifiedName~EfCorePostgreSqlCronSeedingTests|FullyQualifiedName~EfTransactionalSchedulingTests.PostgreSql' $LINE

      - name: Pack other projects
        run: |
          dotnet pack src/TickerQ/TickerQ.csproj --configuration Release --output ./nupkgs $LINE
          dotnet pack src/TickerQ.EntityFrameworkCore/TickerQ.EntityFrameworkCore.csproj --configuration Release --output ./nupkgs $LINE
          dotnet pack src/TickerQ.Dashboard/TickerQ.Dashboard.csproj --configuration Release --output ./nupkgs $LINE
          dotnet pack src/TickerQ.Instrumentation.OpenTelemetry/TickerQ.Instrumentation.OpenTelemetry.csproj --configuration Release --output ./nupkgs $LINE
          dotnet pack src/TickerQ.Caching.StackExchangeRedis/TickerQ.Caching.StackExchangeRedis.csproj --configuration Release --output ./nupkgs $LINE
          dotnet pack src/TickerQ.MongoDB/TickerQ.MongoDB.csproj --configuration Release --output ./nupkgs $LINE
          dotnet pack src/TickerQ.Integrations/TickerQ.Integrations.csproj --configuration Release --output ./nupkgs $LINE

      - name: Verify installed packages and NativeAOT consumers
        env:
          VERSION: ${{ steps.line.outputs.version }}
          FRAMEWORK: ${{ steps.line.outputs.framework }}
        run: |
          # SignalR supports Native AOT from .NET 9, so the .NET 8 dashboard is verified as a managed consumer only.
          AOT="--rid linux-x64 --aot"
          if [ "${{ matrix.dotnet }}" = "8" ]; then AOT=""; fi
          python3 scripts/verify-package-consumers.py --packages ./nupkgs --version "$VERSION" --framework "$FRAMEWORK" $AOT

      - name: Validate commercial package licenses
        run: python3 scripts/validate-package-licenses.py --directory ./nupkgs --version "${{ steps.line.outputs.version }}" --commercial-license ./LICENSE.md --third-party-notices ./THIRD-PARTY-NOTICES.md --dashboard-third-party-notices ./src/TickerQ.Dashboard/DASHBOARD-THIRD-PARTY-NOTICES.md --repository-commit "${{ github.sha }}"

      - name: Show package file sizes
        run: |
          echo "📦 Package sizes:"
          for pkg in ./nupkgs/*.nupkg; do
            [ -f "$pkg" ] && size=$(du -h "$pkg" | cut -f1) && echo " - $(basename "$pkg"): $size"
          done

      - name: Upload nupkgs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # One artifact per line; publish.yml requires exactly nupkgs-net8, -net9, -net10, and -net11.
          name: nupkgs-net${{ matrix.dotnet }}
          # Library packages ship with a .snupkg symbol package (see src/Directory.Build.props).
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
          if-no-files-found: error

  mongo-verify:
    name: MongoDB runtime verification (.NET ${{ matrix.dotnet }})
    # Runtime verification is deliberately independent of package creation, so
    # the MongoDB Testcontainers suite runs on every release and manual build.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: [8, 9, 10, 11]
    env:
      DOTNET_NOLOGO: true
      LINE: -p:TickerQDotNetMajor=${{ matrix.dotnet }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Every line compiles with the .NET 10 SDK (C# 14) and tests on its own runtime; the .NET 11
      # preview SDK builds that line while .NET 11 is a release candidate.
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Setup .NET ${{ matrix.dotnet }} runtime
        if: matrix.dotnet == 8 || matrix.dotnet == 9
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ matrix.dotnet }}.0.x

      - name: Setup .NET 11 preview SDK
        if: matrix.dotnet == 11
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Docker info preflight
        run: docker info

      - name: Build TickerQ.Utilities
        run: dotnet build src/TickerQ.Utilities/TickerQ.Utilities.csproj --configuration Release $LINE

      - name: Pack TickerQ.Utilities
        run: dotnet pack src/TickerQ.Utilities/TickerQ.Utilities.csproj --configuration Release --output ./nupkgs $LINE

      - name: Add local nupkgs source
        run: dotnet nuget add source "$(pwd)/nupkgs" --name LocalNupkgs

      - name: Restore MongoDB tests
        run: dotnet restore tests/TickerQ.MongoDB.Tests/TickerQ.MongoDB.Tests.csproj $LINE

      - name: Build MongoDB tests
        run: dotnet build tests/TickerQ.MongoDB.Tests/TickerQ.MongoDB.Tests.csproj --configuration Release $LINE

      - name: Run MongoDB tests
        run: |
          dotnet test tests/TickerQ.MongoDB.Tests/ --configuration Release --no-build --logger "trx;LogFileName=mongo.trx" --results-directory TestResults/Mongo $LINE

      - name: Capture Docker diagnostics on failure
        # Runs only when a prior step failed; the '|| true' guards keep this step
        # green so it never masks the underlying test failure that already marked
        # the job as failed.
        if: failure()
        run: |
          mkdir -p TestResults/Mongo
          docker info > TestResults/Mongo/docker-info.txt 2>&1 || true
          docker ps -a > TestResults/Mongo/docker-ps.txt 2>&1 || true

      - name: Upload MongoDB test diagnostics and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mongo-test-results-net${{ matrix.dotnet }}
          path: TestResults/Mongo
          if-no-files-found: warn

  release-notification:
    needs:
      - prepare
      - build
      - mongo-verify
    if: always() && github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord notification
        if: always()
        continue-on-error: true
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MONGO_RESULT: ${{ needs.mongo-verify.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
          VERSION: ${{ needs.prepare.outputs.versions }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          message="📦 *${repo_name}* | Branch: \`${RELEASE_TARGET}\` | Release: \`${RELEASE_TAG}\`"

          if [ "$PREPARE_RESULT" != "success" ]; then
            status_emoji="❌"
            status_text="Preparation Failed"
            color=15158332
          elif [ "$MONGO_RESULT" != "success" ]; then
            status_emoji="❌"
            status_text="MongoDB Verification Failed"
            color=15158332
          elif [ "$BUILD_RESULT" != "success" ]; then
            status_emoji="❌"
            status_text="Build Failed"
            color=15158332
          else
            status_emoji="✅"
            status_text="Successful"
            color=3066993
          fi

          jq -n \
            --arg title "${status_emoji} TickerQ Deployment ${status_text}" \
            --arg description "$message" \
            --arg version "$VERSION" \
            --arg build_status "$BUILD_RESULT" \
            --arg footer "Deployed on $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --argjson color "$color" \
            '{embeds: [{title: $title, description: $description, color: $color,
              fields: [
                {name: "Version", value: $version, inline: true},
                {name: "Build Status", value: $build_status, inline: true}
              ], footer: {text: $footer}}]}' > payload.json

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST "$DISCORD_WEBHOOK" \
            --data @payload.json
