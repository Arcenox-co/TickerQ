name: Publish Packages

on:
  workflow_run:
    workflows: [Build NuGet Packages]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  authenticate:
    if: >-
      github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.producer.outputs.run_id }}
      source_sha: ${{ steps.producer.outputs.source_sha }}

    steps:
      - name: Authenticate producer run and artifacts
        id: producer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "producer run ID is invalid" >&2
            exit 1
          }

          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          trusted_workflow_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml" --jq '.id')

          [[ "$(jq -r '.workflow_id' <<<"$run_json")" == "$trusted_workflow_id" ]] || {
            echo "producer run did not execute the canonical build workflow" >&2
            exit 1
          }
          [[ "$(jq -r '.path' <<<"$run_json")" == ".github/workflows/build.yml" ]] || {
            echo "producer workflow path is not canonical" >&2
            exit 1
          }
          [[ "$(jq -r '.event' <<<"$run_json")" == "release" ]] || {
            echo "production publication requires an official release event" >&2
            exit 1
          }
          [[ "$(jq -r '.status' <<<"$run_json")" == "completed" && \
             "$(jq -r '.conclusion' <<<"$run_json")" == "success" ]] || {
            echo "producer run is not successfully completed" >&2
            exit 1
          }
          [[ "$(jq -r '.head_repository.full_name' <<<"$run_json")" == "$GITHUB_REPOSITORY" ]] || {
            echo "producer run belongs to a different repository" >&2
            exit 1
          }

          source_sha=$(jq -r '.head_sha' <<<"$run_json")
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" == "$EVENT_SOURCE_SHA" ]] || {
            echo "producer source SHA is invalid or disagrees with the workflow-run event" >&2
            exit 1
          }

          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")
          nupkgs_count=$(jq '[.artifacts[] | select(.name == "nupkgs" and .expired == false)] | length' <<<"$artifacts")
          npm_count=$(jq '[.artifacts[] | select(.name == "npm-package" and .expired == false)] | length' <<<"$artifacts")

          [[ "$nupkgs_count" == "1" && "$npm_count" == "1" ]] || {
            echo "expected one unexpired nupkgs and npm-package artifact; found ${nupkgs_count} and ${npm_count}" >&2
            exit 1
          }

          {
            echo "run_id=$RUN_ID"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: authenticate
    runs-on: ubuntu-latest
    environment: production-publish

    steps:
      - name: Checkout trusted publication policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout immutable release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authenticate.outputs.source_sha }}
          path: release-source
          persist-credentials: false

      - name: Download exact producer artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.authenticate.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name nupkgs --dir nupkgs
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name npm-package --dir npm-package

      - name: Derive immutable artifact versions
        id: versions
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tarfile
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          nuget_versions = set()
          for path in Path("nupkgs").glob("*.nupkg"):
              with zipfile.ZipFile(path) as archive:
                  nuspecs = [name for name in archive.namelist() if name.lower().endswith(".nuspec")]
                  if len(nuspecs) != 1:
                      raise SystemExit(f"{path}: expected exactly one nuspec")
                  root = ET.fromstring(archive.read(nuspecs[0]))
                  version = root.findtext(".//{*}metadata/{*}version")
                  if not version:
                      raise SystemExit(f"{path}: missing package version")
                  nuget_versions.add(version.strip())
          if len(nuget_versions) != 1:
              raise SystemExit(f"expected one NuGet version, found {sorted(nuget_versions)}")
          nuget_version = next(iter(nuget_versions))
          semver = re.compile(
              r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
              r"(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?"
              r"(?:\+[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$"
          )
          if semver.fullmatch(nuget_version) is None:
              raise SystemExit(f"unsafe or invalid NuGet version {nuget_version!r}")

          npm_archives = list(Path("npm-package").glob("*.tgz"))
          if len(npm_archives) != 1:
              raise SystemExit(f"expected one npm tarball, found {len(npm_archives)}")
          with tarfile.open(npm_archives[0], "r:gz") as archive:
              package_file = archive.extractfile("package/package.json")
              if package_file is None:
                  raise SystemExit("npm tarball has no package/package.json")
              npm_version = json.load(package_file).get("version")
          if not isinstance(npm_version, str) or not npm_version:
              raise SystemExit("npm package version is missing")
          if semver.fullmatch(npm_version) is None:
              raise SystemExit(f"unsafe or invalid npm version {npm_version!r}")
          npm_archive_input = npm_archives[0]
          npm_root = Path("npm-package").resolve()
          if npm_archive_input.is_symlink() or not npm_archive_input.is_file():
              raise SystemExit("npm archive must be a regular file")
          npm_archive = npm_archive_input.resolve()
          if npm_archive.parent != npm_root:
              raise SystemExit(f"npm archive escapes artifact directory: {npm_archive}")
          if re.fullmatch(r"[0-9A-Za-z._-]+\.tgz", npm_archive.name) is None:
              raise SystemExit(f"unsafe npm archive name {npm_archive.name!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"nuget={nuget_version}\n")
              output.write(f"npm={npm_version}\n")
              output.write(f"npm_archive={npm_archive.as_posix()}\n")
          PY

      - name: Validate public Version 1.1 terms and pinned PDF digest
        run: |
          python3 scripts/validate-public-terms.py \
            --agreement release-source/LICENSE.md \
            --expected-version public-master-v1.1 \
            --expected-pdf-sha256-file release-source/licenses/public-master-v1.1.sha256

      - name: Validate exact NuGet artifact set
        env:
          NUGET_VERSION: ${{ steps.versions.outputs.nuget }}
          SOURCE_SHA: ${{ needs.authenticate.outputs.source_sha }}
        run: |
          python3 scripts/validate-package-licenses.py \
            --directory ./nupkgs \
            --version "$NUGET_VERSION" \
            --commercial-license release-source/LICENSE.md \
            --third-party-notices release-source/THIRD-PARTY-NOTICES.md \
            --dashboard-third-party-notices release-source/src/TickerQ.Dashboard/DASHBOARD-THIRD-PARTY-NOTICES.md \
            --repository-commit "$SOURCE_SHA"

      - name: Verify existing NuGet artifacts or stage missing packages
        env:
          NUGET_VERSION: ${{ steps.versions.outputs.nuget }}
          SOURCE_SHA: ${{ needs.authenticate.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p registry-nupkgs missing-nupkgs
          package_ids=(
            TickerQ
            TickerQ.Dashboard
            TickerQ.Utilities
            TickerQ.EntityFrameworkCore
            TickerQ.Instrumentation.OpenTelemetry
            TickerQ.Caching.StackExchangeRedis
            TickerQ.SourceGenerator
            TickerQ.MongoDB
            TickerQ.SDK
            TickerQ.RemoteExecutor
          )

          for package_id in "${package_ids[@]}"; do
            local_package="nupkgs/${package_id}.${NUGET_VERSION}.nupkg"
            registry_package="registry-nupkgs/${package_id}.${NUGET_VERSION}.nupkg"
            lower_id=$(printf '%s' "$package_id" | tr '[:upper:]' '[:lower:]')
            lower_version=$(printf '%s' "$NUGET_VERSION" | tr '[:upper:]' '[:lower:]')
            package_url="https://api.nuget.org/v3-flatcontainer/${lower_id}/${lower_version}/${lower_id}.${lower_version}.nupkg"
            status=$(curl -sS -L -o "$registry_package" -w "%{http_code}" "$package_url")

            if [ "$status" = "200" ]; then
              python3 scripts/compare-nuget-packages.py \
                --local "$local_package" \
                --registry "$registry_package"
            elif [ "$status" = "404" ]; then
              rm -f "$registry_package"
              cp "$local_package" "$registry_package"
              cp "$local_package" "missing-nupkgs/"
            else
              echo "NuGet returned HTTP $status while checking $package_id@$NUGET_VERSION" >&2
              exit 1
            fi
          done

          python3 scripts/validate-package-licenses.py \
            --directory ./registry-nupkgs \
            --version "$NUGET_VERSION" \
            --commercial-license release-source/LICENSE.md \
            --third-party-notices release-source/THIRD-PARTY-NOTICES.md \
            --dashboard-third-party-notices release-source/src/TickerQ.Dashboard/DASHBOARD-THIRD-PARTY-NOTICES.md \
            --repository-commit "$SOURCE_SHA"

      - name: Validate exact npm artifact
        env:
          NPM_ARCHIVE: ${{ steps.versions.outputs.npm_archive }}
          NPM_VERSION: ${{ steps.versions.outputs.npm }}
        run: |
          python3 scripts/validate-node-package.py \
            --archive "$NPM_ARCHIVE" \
            --version "$NPM_VERSION" \
            --commercial-license release-source/LICENSE.md \
            --third-party-notices release-source/THIRD-PARTY-NOTICES.md

      - name: Configure package registries
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify publication credentials are configured
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NUGET_API_KEY" || { echo "NUGET_API_KEY is not configured" >&2; exit 1; }
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is not configured" >&2; exit 1; }

      - name: Publish or verify exact npm artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_ARCHIVE: ${{ steps.versions.outputs.npm_archive }}
          NPM_VERSION: ${{ steps.versions.outputs.npm }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o npm-version.json -w "%{http_code}" \
            "https://registry.npmjs.org/@tickerq%2fsdk/$NPM_VERSION")
          if [ "$status" = "404" ]; then
            npm publish "$NPM_ARCHIVE" \
              --registry https://registry.npmjs.org \
              --access public
          elif [ "$status" = "200" ]; then
            expected=$(jq -r '.dist.integrity // empty' npm-version.json)
            actual="sha512-$(openssl dgst -sha512 -binary "$NPM_ARCHIVE" | openssl base64 -A)"
            [ -n "$expected" ] && [ "$actual" = "$expected" ] || {
              echo "npm already contains @tickerq/sdk@$NPM_VERSION with a different artifact digest" >&2
              exit 1
            }
            echo "@tickerq/sdk@$NPM_VERSION already exists with the exact artifact digest; skipping."
          else
            echo "npm registry returned HTTP $status while checking @tickerq/sdk@$NPM_VERSION" >&2
            exit 1
          fi

      - name: Publish missing NuGet artifacts
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(missing-nupkgs/*.nupkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "All NuGet packages already exist and match the producer artifacts."
            exit 0
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY"
          done
