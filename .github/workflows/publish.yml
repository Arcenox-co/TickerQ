name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      artifact_id:
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    environment:
      name: production-publish

    steps:
      - name: Checkout validation policy
        uses: actions/checkout@v4

      - name: Validate source license policy
        run: python3 -m unittest scripts.tests.test_license_policy -v

      - name: Download artifact ZIP by ID
        run: |
          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ github.event.inputs.artifact_id }}/zip \
            -o artifact.zip

      - name: Extract artifact
        run: unzip artifact.zip -d ./nupkgs

      - name: Validate package versions and licenses
        run: python3 scripts/validate-package-licenses.py --directory ./nupkgs --version "${{ github.event.inputs.version }}" --commercial-license ./LICENSE.md --third-party-notices ./THIRD-PARTY-NOTICES.md --repository-commit "${{ github.sha }}"

      - name: Publish to NuGet
        run: |
          for f in ./nupkgs/*.nupkg; do
            echo "📦 Pushing $(basename "$f")..."
            dotnet nuget push "$f" \
              --source https://api.nuget.org/v3/index.json \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --skip-duplicate
          done

      - name: Publish symbols to NuGet
        run: |
          for f in ./nupkgs/*.snupkg; do
            [ -f "$f" ] || continue
            echo "🔗 Pushing symbols $(basename "$f")..."
            dotnet nuget push "$f" \
              --source https://api.nuget.org/v3/index.json \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --skip-duplicate
          done
