name: Sync Version Branches

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source release line to synchronize'
        required: true
        default: 'main-commercial'
        type: choice
        options: ['main-commercial', 'main']
      target_branches:
        description: 'Comma-separated list of target branches (default: net8,net9)'
        required: false
        default: 'net8,net9'
        type: string
      dry_run:
        description: 'Run without making changes'
        required: false
        default: false
        type: boolean

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.config.outputs.targets }}
    steps:
      - id: config
        env:
          REQUESTED_TARGETS: ${{ inputs.target_branches }}
          DEFAULT_TARGETS: ${{ vars.TARGET_BRANCHES || '["net8","net9"]' }}
        run: |
          python3 - <<'PYCONFIG'
          import json, os
          requested = os.environ['REQUESTED_TARGETS'].strip()
          targets = [x.strip() for x in requested.split(',')] if requested else json.loads(os.environ['DEFAULT_TARGETS'])
          if not targets or any(x not in ('net8', 'net9') for x in targets):
              raise SystemExit('Only net8 and net9 are supported target branches')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('targets=' + json.dumps(list(dict.fromkeys(targets))) + '\n')
          PYCONFIG

  sync-branches:
    needs: prepare
    env:
      SOURCE_BRANCH: ${{ inputs.source_branch || vars.SYNC_SOURCE_BRANCH || 'main-commercial' }}
      TARGET_BRANCH: ${{ matrix.target_branch }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_TARGET: ${{ github.event.release.target_commitish }}

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        target_branch: ${{ fromJSON(needs.prepare.outputs.targets) }}
      fail-fast: false

    steps:
      - name: Check PAT_TOKEN exists
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "::error::PAT_TOKEN secret is not configured"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Check if sync is needed
        id: check
        run: |
          set -euo pipefail
          case "$SOURCE_BRANCH" in main|main-commercial) ;; *) echo "::error::Unsupported source branch"; exit 1 ;; esac
          git show-ref --verify --quiet "refs/remotes/origin/$SOURCE_BRANCH"
          source_ref="origin/$SOURCE_BRANCH"
          if [ -n "$RELEASE_TAG" ]; then
            # Never synchronize a release from another product line or include
            # commits made after the released tag.
            if [ "$RELEASE_TARGET" != "$SOURCE_BRANCH" ] && ! [[ "$RELEASE_TARGET" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "needs_sync=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            source_ref=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
            git merge-base --is-ancestor "$source_ref" "origin/$SOURCE_BRANCH"
          fi
          echo "SOURCE_REF=$source_ref" >> "$GITHUB_ENV"
          if ! git show-ref --verify --quiet "refs/remotes/origin/$TARGET_BRANCH"; then
            echo "::error::Target branch $TARGET_BRANCH does not exist"
            exit 1
          fi
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          if git merge-base --is-ancestor "$source_ref" "$TARGET_BRANCH"; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync changes
        if: steps.check.outputs.needs_sync == 'true'
        id: sync
        run: |
          set -euo pipefail

          TARGET="$TARGET_BRANCH"
          DOTNET_VER=$(echo "$TARGET" | sed 's/[^0-9]*//g')

          # Create sync branch from target
          sync_branch="sync-${SOURCE_BRANCH}-to-${TARGET}-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$sync_branch" "$TARGET"

          # ── Load .sync-exclude list from the source branch ──
          EXCLUDE_FILES=()
          if git show "$SOURCE_REF":.sync-exclude > /tmp/.sync-exclude 2>/dev/null; then
            while IFS= read -r line; do
              line=$(echo "$line" | sed 's/#.*//' | xargs)
              [ -n "$line" ] && EXCLUDE_FILES+=("$line")
            done < /tmp/.sync-exclude
            echo "Loaded ${#EXCLUDE_FILES[@]} files from .sync-exclude ($SOURCE_BRANCH)"
          fi

          # ── Save excluded files from target branch before merge ──
          echo "📦 Saving version-specific files from $TARGET..."
          mkdir -p /tmp/excluded-files
          for excl in "${EXCLUDE_FILES[@]}"; do
            if [ -f "$excl" ]; then
              mkdir -p "/tmp/excluded-files/$(dirname "$excl")"
              cp "$excl" "/tmp/excluded-files/$excl"
              echo "  Saved: $excl"
            fi
          done

          # ── Load .sync-overrides rules from the source branch ──
          OVERRIDE_RULES=()
          if git show "$SOURCE_REF":.sync-overrides > /tmp/.sync-overrides 2>/dev/null; then
            while IFS= read -r line; do
              line=$(echo "$line" | sed 's/#.*//' | xargs)
              [ -n "$line" ] && OVERRIDE_RULES+=("$line")
            done < /tmp/.sync-overrides
            echo "Loaded ${#OVERRIDE_RULES[@]} override rules from .sync-overrides ($SOURCE_BRANCH)"
          fi

          git show "$SOURCE_REF":scripts/sync_version_overrides.py > /tmp/sync_version_overrides.py
          python3 /tmp/sync_version_overrides.py --rules /tmp/.sync-overrides --preserved /tmp/sync-preserved.json --snapshot

          # ── Merge the selected source into the sync branch ──
          echo "🔀 Merging $SOURCE_BRANCH into $TARGET..."
          merge_failed=false
          if ! git merge "$SOURCE_REF" --no-edit -m "Merge ${SOURCE_BRANCH} into ${TARGET}" 2>/dev/null; then
            echo "Merge conflicts detected; only explicit version overrides and exclusions may be resolved automatically."

            # Get list of conflicted files
            conflicted_files=$(git diff --name-only --diff-filter=U 2>/dev/null || true)

            for file in $conflicted_files; do
              is_excluded=false
              for excl in "${EXCLUDE_FILES[@]}"; do
                if [ "$file" = "$excl" ]; then
                  is_excluded=true
                  break
                fi
              done

              if [ "$is_excluded" = true ]; then
                # Keep target branch version for excluded files
                git checkout --ours -- "$file" 2>/dev/null || true
                echo "  Kept $TARGET version: $file"
              elif printf '%s\n' "${OVERRIDE_RULES[@]}" | cut -d'|' -f1 | grep -Fxq "$file"; then
                # The validated override script reapplies target-specific values.
                git checkout --theirs -- "$file"
              else
                echo "::error::Manual merge/backport required for $file"
                exit 1
              fi
              git add "$file" 2>/dev/null || true
            done

            # Complete the merge
            if ! git commit --no-edit 2>/dev/null; then
              echo "::error::Failed to complete merge"
              merge_failed=true
            fi
          fi

          if [ "$merge_failed" = true ]; then
            echo "::error::Merge failed and could not be resolved"
            exit 1
          fi

          echo "✅ Merge completed"

          # ── Restore excluded files from target branch ──
          RESTORED_FILES=()
          echo "Restoring version-specific files..."
          for excl in "${EXCLUDE_FILES[@]}"; do
            if [ -f "/tmp/excluded-files/$excl" ]; then
              cp "/tmp/excluded-files/$excl" "$excl"
              git add "$excl"
              RESTORED_FILES+=("$excl")
              echo "  Restored: $excl"
            fi
          done

          # ── Apply .sync-overrides rules ──
          OVERRIDE_DETAILS=()
          python3 /tmp/sync_version_overrides.py --rules /tmp/.sync-overrides --preserved /tmp/sync-preserved.json --version "$DOTNET_VER" > /tmp/sync-overrides-applied.txt
          mapfile -t OVERRIDE_DETAILS < /tmp/sync-overrides-applied.txt
          cat /tmp/sync-overrides-applied.txt

          # ── Save details for PR comment ──
          {
            echo "RESTORED_FILES<<EOFRF"
            printf '%s\n' "${RESTORED_FILES[@]}"
            echo "EOFRF"
            echo "OVERRIDE_DETAILS<<EOFOD"
            printf '%s\n' "${OVERRIDE_DETAILS[@]}"
            echo "EOFOD"
          } >> $GITHUB_ENV

          # ── Stage and amend if there are post-merge fixes ──
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Apply version-specific overrides for ${TARGET}"
          fi

          echo "📋 Final state:"
          git log --oneline -3

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🏃 Dry run — not pushing"
            exit 0
          fi

          # ── Push ──
          if git push origin "$sync_branch" 2>/dev/null; then
            echo "sync_branch=$sync_branch" >> $GITHUB_ENV
            echo "push_repo=${{ github.repository }}" >> $GITHUB_ENV
          else
            FORK_OWNER="${{ vars.FORK_OWNER || 'arcenox' }}"
            FORK_URL="https://${{ secrets.PAT_TOKEN }}@github.com/${FORK_OWNER}/TickerQ.git"
            git remote add fork "$FORK_URL" 2>/dev/null || git remote set-url fork "$FORK_URL"
            if git push fork "$sync_branch"; then
              echo "sync_branch=$sync_branch" >> $GITHUB_ENV
              echo "push_repo=${FORK_OWNER}/TickerQ" >> $GITHUB_ENV
            else
              echo "::error::Failed to push to both origin and fork"
              exit 1
            fi
          fi

      - name: Ensure labels exist
        if: steps.check.outputs.needs_sync == 'true' && env.sync_branch != ''
        run: |
          gh label create "automated" --description "Automated PR" --color "0E8A16" 2>/dev/null || true
          gh label create "sync" --description "Branch synchronization" --color "1D76DB" 2>/dev/null || true
          gh label create "${{ matrix.target_branch }}" --description "Target: ${{ matrix.target_branch }} branch" --color "FEF2C0" 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Create Pull Request
        if: steps.check.outputs.needs_sync == 'true' && env.sync_branch != ''
        run: |
          cat > /tmp/sync-pr.md <<EOF
          ## Automated Branch Sync

          This PR merges changes from \`$SOURCE_BRANCH\` (\`$SOURCE_REF\`) into \`$TARGET_BRANCH\`.

          VersionPrefix, target framework and dependency ranges were checked by the override script.
          Review preserved EF files in .sync-exclude for manual backports, then build and test the target before release.
          EOF

          if [ "${{ env.push_repo }}" = "${{ github.repository }}" ]; then
            gh pr create \
              --base "${{ matrix.target_branch }}" \
              --head "${{ env.sync_branch }}" \
              --title "Sync $SOURCE_BRANCH → ${{ matrix.target_branch }}" \
              --body-file /tmp/sync-pr.md \
              2>&1 | tee pr_output.txt
          else
            FORK_OWNER=$(echo "${{ env.push_repo }}" | cut -d'/' -f1)
            gh pr create \
              --base "${{ matrix.target_branch }}" \
              --head "${FORK_OWNER}:${{ env.sync_branch }}" \
              --repo "${{ github.repository }}" \
              --title "Sync $SOURCE_BRANCH → ${{ matrix.target_branch }}" \
              --body-file /tmp/sync-pr.md \
              2>&1 | tee pr_output.txt
          fi

          PR_NUMBER=$(grep -oP '(?<=pull/)\d+' pr_output.txt || echo "")
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --add-label "automated,sync,${{ matrix.target_branch }}" 2>/dev/null || true
            echo "pr_number=$PR_NUMBER" >> $GITHUB_ENV
            echo "Created PR #$PR_NUMBER"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Add sync details comment
        if: steps.check.outputs.needs_sync == 'true' && env.pr_number != ''
        run: |
          COMMENT="### Sync Details\n\n"

          # Excluded files restored
          if [ -n "${{ env.RESTORED_FILES }}" ]; then
            COMMENT+="#### Excluded files restored from \`${{ matrix.target_branch }}\`\n"
            COMMENT+="_These files have version-specific implementations and were kept as-is (defined in \`.sync-exclude\`)._\n\n"
            while IFS= read -r file; do
              [ -n "$file" ] && COMMENT+="- \`${file}\`\n"
            done <<< "${{ env.RESTORED_FILES }}"
            COMMENT+="\n"
          else
            COMMENT+="#### Excluded files\nNo excluded files were restored.\n\n"
          fi

          # Version overrides applied
          if [ -n "${{ env.OVERRIDE_DETAILS }}" ]; then
            COMMENT+="#### Version overrides applied\n"
            COMMENT+="_Rules from \`.sync-overrides\` were applied to match \`${{ matrix.target_branch }}\` versions._\n\n"
            COMMENT+="| File | Property | Change |\n"
            COMMENT+="|------|----------|--------|\n"
            while IFS= read -r detail; do
              if [ -n "$detail" ]; then
                IFS='|' read -r file prop change <<< "$detail"
                COMMENT+="| \`${file}\` | \`${prop}\` | ${change} |\n"
              fi
            done <<< "${{ env.OVERRIDE_DETAILS }}"
            COMMENT+="\n"
          else
            COMMENT+="#### Version overrides\nNo overrides were needed.\n\n"
          fi

          # Retry in case PR isn't fully indexed yet
          for i in 1 2 3; do
            if echo -e "$COMMENT" | gh pr comment "${{ env.pr_number }}" --body-file - 2>/dev/null; then
              break
            fi
            echo "Retry $i — waiting for PR to be available..."
            sleep 5
          done
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

  summary:
    needs: sync-branches
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Branch Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.sync-branches.result }}" = "success" ]; then
            echo "All branch syncs completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "Some branch syncs failed — check individual job logs" >> $GITHUB_STEP_SUMMARY
          fi
